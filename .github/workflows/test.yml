name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 各 AI ツールの設定の置き場は OS ごとに違う。3 つとも回して、
    # パスの組み立てやスケジューラ解析が壊れていないことを確かめる。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 依存を入れる
        run: uv venv --python ${{ matrix.python }} && uv pip install pytest -e .

      - name: テスト
        run: uv run pytest tests/ -q

      - name: 実際に走査して HTML を生成できるか
        # 中身のない一時ディレクトリを起点にして、空の環境でも
        # 例外を投げずに成果物が出ることを確認する。
        run: uv run ai-env-map --home . --no-open --fast -o out.html

      - name: 生成物が自己完結しているか
        shell: python
        # Windows のランナーは標準出力が cp1252 のため、この検証スクリプト自身の
        # 出力は ASCII に限る。日本語を print すると検証の中身とは無関係に落ちる。
        run: |
          import re
          html = open("out.html", encoding="utf-8").read()
          external = re.findall(r'(?:src|href)="(?:https?:)?//', html)
          assert not external, f"external reference found: {external[:3]}"
          assert "<title>" in html, "no title tag"
          assert len(html) > 1000, f"output too small: {len(html)}"
          print(f"OK: {len(html)} chars, 0 external references")
